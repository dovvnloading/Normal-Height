name: Production workflow browser coverage

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/e2e/project-library.spec.ts'
      - 'tests/e2e/graph-reuse.spec.ts'
      - 'tests/e2e/world-material-export.spec.ts'
      - 'playwright*.config.ts'
      - 'package*.json'
      - '.github/workflows/production-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: ${{ matrix.browser }} project, graph and delivery workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify real browser storage, worker exports and authoring
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test --config playwright.cross-browser.config.ts --project ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-${{ matrix.browser }}-evidence
          path: |
            test-results-cross-browser/
            playwright-report/
          retention-days: 14
