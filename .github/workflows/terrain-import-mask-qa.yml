name: Terrain import and mask browser acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/components/**'
      - 'src/engine/**'
      - 'src/export/**'
      - 'src/hooks/useTerrainEngine.ts'
      - 'src/import/**'
      - 'src/model/**'
      - 'tests/e2e/terrain-nodes.spec.ts'
      - 'tests/e2e/mask-preview.spec.ts'
      - '.github/workflows/terrain-import-mask-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrain-import-mask-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terrain-import-mask:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify import, coastal grading, session restore, mask preview and export
        run: npx playwright test tests/e2e/terrain-nodes.spec.ts tests/e2e/mask-preview.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-import-mask-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
