name: Headless delivery contracts

on:
  push:
    branches: [main]
    paths:
      - 'src/cli/**'
      - 'scripts/nh.mjs'
      - 'src/engine/**'
      - 'src/model/**'
      - 'src/export/**'
      - 'src/materials/**'
      - 'tests/cli.test.ts'
      - 'tests/graph-contracts.test.ts'
      - 'package*.json'
      - '.github/workflows/cli.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/cli/**'
      - 'scripts/nh.mjs'
      - 'src/engine/**'
      - 'src/model/**'
      - 'src/export/**'
      - 'src/materials/**'
      - 'tests/cli.test.ts'
      - 'tests/graph-contracts.test.ts'
      - 'package*.json'
      - '.github/workflows/cli.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headless-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} delivery contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Headless build, integrity and cancellation
        run: npm test -- tests/cli.test.ts tests/graph-contracts.test.ts
      - name: Verify public launcher help
        run: node scripts/nh.mjs --help
